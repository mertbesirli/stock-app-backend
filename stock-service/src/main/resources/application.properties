spring.application.name=stock-service
server.port=8083

# Kafka Broker Ayarları
spring.kafka.bootstrap-servers=localhost:9092

# Consumer (Emirleri Dinlemek İçin)
spring.kafka.consumer.group-id=stock-service-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Ortak kütüphanedeki sınıfları çözebilmesi için JsonDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.midas.*

# Producer (Sonuçları Wallet'a Geri Dönmek İçin)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Hata Yönetimi
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer