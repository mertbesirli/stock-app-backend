spring.application.name=wallet-service

server.port=8081

# PostgreSQL Bağlantı Bilgileri (Docker-compose dosyamızdaki değerlerle birebir aynı)
spring.datasource.url=jdbc:postgresql://localhost:5432/midas_wallet_db
spring.datasource.username=midas_user
spring.datasource.password=midas_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Ayarları
# update: Uygulama her ayağa kalktığında veritabanı tablolarını otomatik oluşturur/günceller.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka Yapılandırması
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer ayarları (Saga cevabını dinlemek için)
spring.kafka.consumer.group-id=wallet-saga-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.midas.*